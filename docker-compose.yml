services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: georouter
      MYSQL_USER: georouter
      MYSQL_PASSWORD: georouter
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - '3306:3306'
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - '3000:3000'
    environment:
      - DATABASE_URL=mysql://georouter:georouter@db:3306/georouter
      - JWT_SECRET=change_me_secure
      - JWT_EXPIRES_IN=1h
      - PORT=3000
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma db push && npm run seed && node server.js"

volumes:
  db_data:
