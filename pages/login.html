<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GeoRoute BR - Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/Geo-Router/css/style.css">
</head>
<body class="georouter-page">
  <header>
    <nav class="navbar navbar-light bg-primary shadow-sm">
      <div class="container-fluid">
        <button class="btn btn-outline-light me-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-controls="offcanvasMenu">
          <svg xmlns='http://www.w3.org/2000/svg' width='28' height='28' fill='currentColor' class='bi bi-list' viewBox='0 0 16 16'><path fill-rule='evenodd' d='M2.5 12a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-11zm0-4a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-11zm0-4a.5.5 0 0 1 0-1h11a.5.5 0 0 1 0 1h-11z'/></svg>
        </button>
        <span class="navbar-brand mb-0 h1 text-white">GeoRoute BR - Login</span>
      </div>
    </nav>
    <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasMenu" aria-labelledby="offcanvasMenuLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvasMenuLabel">Menu</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body">
        <ul class="nav flex-column">
          <li class="nav-item mb-2"><a class="nav-link" href="../index.html">Home</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="map.html">Mapa</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="search.html">Busca</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="as_detail.html">Detalhe AS</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="about.html">Sobre</a></li>
          <li class="nav-item mb-2"><a class="nav-link" href="contact.html">Contato</a></li>
          <li class="nav-item mb-2"><a class="nav-link active text-primary fw-bold" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        <div class="card shadow-sm">
          <div class="card-body">
            <h3 class="card-title text-center mb-4">Login Administrativo</h3>
            <form id="loginForm">
              <div class="mb-3">
                <label for="loginEmail" class="form-label">Email</label>
                <input id="loginEmail" type="email" class="form-control" placeholder="admin@georoute.com" required />
              </div>
              <div class="mb-3">
                <label for="loginPassword" class="form-label">Senha</label>
                <input id="loginPassword" type="password" class="form-control" placeholder="********" required />
              </div>
              <button id="loginBtn" class="btn btn-primary w-100" type="submit">Entrar</button>
            </form>
            <div id="loginStatus" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="bg-light border-top mt-auto py-3">
    <div class="container text-center text-muted small">
      &copy; 2026 GeoRoute BR. Todos os direitos reservados.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script type="module" src="../js/login.js"></script>
</body>
</html>
